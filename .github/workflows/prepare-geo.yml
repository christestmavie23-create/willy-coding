name: Prepare geo data chunks

on:
  push:
    branches: [geo-atelier-prep]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build admin-1 mesh
        run: node scripts/process2.mjs
      - name: Commit chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "mesh chunks [skip ci]"
            git push
          fi
